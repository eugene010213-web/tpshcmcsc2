<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公開意見回覆專區 - TPSHCMCSC</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .filter-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 8px 16px;
            border: 1px solid #cbd5e1;
            background: white;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            color: #64748b;
            transition: all 0.2s;
        }
        .filter-btn.active, .filter-btn:hover {
            background: #d49a00;
            color: white;
            border-color: #d49a00;
        }
        .public-card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            border-left: 5px solid #16a34a;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px dashed #e2e8f0;
        }
        .tag-category {
            background: #fef3c7;
            color: #92400e;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .tag-assignee {
            background: #f1f5f9;
            color: #475569;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.85rem;
        }
        .question-box {
            background: #f8fafc;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 14px;
            color: #334155;
        }
        .reply-box {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            padding: 14px;
            border-radius: 10px;
            color: #166534;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">
                <img src="tpshcmcsc.png" alt="會徽" style="width: 60px; height: auto; vertical-align: middle; filter: brightness(0);">
                <span class="brand-text">TPSHCMCSC</span>
            </a>
            <div class="nav-links">
                <a href="index.html" class="nav-item">意見箱首頁</a>
                <a href="replies.html" class="nav-item active" style="color: #d49a00;">📢 公開回覆專區</a>
                <a href="admin.html" class="nav-item admin-btn">
                    <span class="admin-icon">⚙️</span> 幹部管理後台
                </a>
            </div>
        </div>
    </nav>

    <header class="hero-header">
        <h1>📢 學生會公開回覆專區</h1>
        <p class="hero-subtitle">感謝同學的寶貴建言，以下為學生會已處理與回覆之案件</p>
    </header>

    <main class="container" style="display: block;">
        <div class="filter-bar">
            <button class="filter-btn active" onclick="filterData('all', event)">全部類別</button>
            <button class="filter-btn" onclick="filterData('校園設施', event)">校園設施</button>
            <button class="filter-btn" onclick="filterData('活動建議', event)">活動建議</button>
            <button class="filter-btn" onclick="filterData('規範權益', event)">規範權益</button>
            <button class="filter-btn" onclick="filterData('其他', event)">其他</button>
        </div>

        <div id="public-reply-list">
            <p style="text-align:center; color:#94a3b8; padding:40px;">正在載入回覆紀錄...</p>
        </div>
    </main>

    <footer>
        <p>胡志明市台灣學校學生會 TPSHCMCSC &copy; 2026</p>
    </footer>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbyW-LakjnyulyNnPrNS06TntWKli3__iewn3qIy_6lUC6NFc6U4NIkyrYyNdc52jCjL/exec';
        let allReplies = [];

        window.onload = function() {
            fetch(`${GAS_URL}?action=getPublicReplies`)
                .then(res => res.json())
                .then(data => {
                    allReplies = data || [];
                    renderReplies(allReplies);
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('public-reply-list').innerHTML = 
                        '<p style="text-align:center; color:#ef4444; padding:40px;">載入失敗，請確認網路連線是否正常。</p>';
                });
        };

        function renderReplies(data) {
            const container = document.getElementById('public-reply-list');
            if (!data || data.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#94a3b8; padding:40px;">目前尚無已回覆的意見公開紀錄。</p>';
                return;
            }

            container.innerHTML = data.map(item => `
                <div class="public-card">
                    <div class="card-header">
                        <div>
                            <span class="tag-category">${item.category}</span>
                            <span class="tag-assignee">負責幹部：${item.assignee || '不指定'}</span>
                        </div>
                        <small style="color:#94a3b8;">${item.created_at || ''}</small>
                    </div>

                    <div class="question-box">
                        <strong>💬 同學建言：</strong>
                        <p style="margin-top:6px; white-space: pre-line;">${item.content}</p>
                    </div>

                    <div class="reply-box">
                        <strong>💡 學生會回覆：</strong>
                        <p style="margin-top:6px; white-space: pre-line;">${item.reply_content}</p>
                    </div>
                </div>
            `).join('');
        }

        function filterData(category, event) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            if (event && event.target) {
                event.target.classList.add('active');
            }

            if (category === 'all') {
                renderReplies(allReplies);
            } else {
                const filtered = allReplies.filter(item => item.category === category);
                renderReplies(filtered);
            }
        }
    </script>
</body>
</html>
